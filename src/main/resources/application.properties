spring.application.name=fitzonev2
server.port=${PORT:8080}

# MongoDB (Local por defecto, en nube usar MONGODB_URI de MongoDB Atlas)
spring.data.mongodb.database=${MONGODB_DATABASE:fitzone_db}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fitzone_db}

# URL base de la aplicación (en nube asignar URL pública HTTPS)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Binario de Python (en Windows: python, en Docker/Linux: python3)
python.executable=${PYTHON_BIN:python}

# SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:fitzonegym.oficial@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Secret
jwt.secret=${JWT_SECRET:cf5d88c23a4e49c3b0e593fcd67e3c5e4a3e497fbffcb6a52906c7aa9b329b43e19437ad364c49b98f2e0ec42f6fbb24}

# Groq API - FitBot
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}